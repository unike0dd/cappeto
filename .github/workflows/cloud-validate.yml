name: Cloud and commerce configuration validation

on:
  pull_request:
    paths:
      - "agent/**"
      - "apps/flutter/**"
      - "contracts/**"
      - "docs/AGENTIC_COMMERCE.md"
      - "firebase/**"
      - "firebase.json"
      - "infra/terraform/**"
      - ".github/workflows/cloud-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate JSON contracts
        run: find agent contracts -type f -name '*.json' -print0 | xargs -0 -r -n1 jq empty

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
