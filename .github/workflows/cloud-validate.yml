name: Cloud and commerce configuration validation

on:
  pull_request:
    paths:
      - "agent/**"
      - "apps/flutter/**"
      - "cloudflare/**"
      - "contracts/**"
      - "docs/AGENTIC_COMMERCE.md"
      - "firebase/**"
      - "firebase.json"
      - "infra/terraform/**"
      - "scripts/build-cloudflare.mjs"
      - "scripts/verify-cloudflare-deployment.mjs"
      - "wrangler.toml"
      - ".github/workflows/cloud-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate JSON contracts
        run: find agent contracts -type f -name '*.json' -print0 | xargs -0 -r -n1 jq empty

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/build-cloudflare.mjs owner
      - run: npx --yes wrangler@4.135.0 deploy --dry-run --env non_specific

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
